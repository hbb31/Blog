name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and format check
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Contrast check
        run: npm run check:contrast
      - name: Build (includes schema drift check and Pagefind index)
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright + axe tests
        run: npm test
      - name: Lighthouse CI
        run: npm run lhci
      - name: Lighthouse metrics summary
        if: always()
        run: node scripts/lhci-summary.mjs || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
