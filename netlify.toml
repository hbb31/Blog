# Netlify configuration.
# - Production deploys build from `main` (set "Production branch" to main in the UI).
# - Every pull request gets a Deploy Preview; CMS branches (cms-*) also get
#   branch deploys if "Branch deploys: All" is enabled. Previews show drafts and are noindexed.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  SHOW_DRAFTS = "false"

[context.deploy-preview.environment]
  SHOW_DRAFTS = "true"

[context.branch-deploy.environment]
  SHOW_DRAFTS = "true"

# Security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com; font-src 'self'; connect-src 'self' https://api.github.com https://github.com; form-action 'self' https://buttondown.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Keep the CMS out of search engines.
[[headers]]
  for = "/keystatic/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Long-lived caching for fingerprinted assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
